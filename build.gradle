plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
    id 'java'
    id 'jacoco'
}

def localProperties = new Properties()
def localPropertiesFile = file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// DevAuth signs runClient into your Microsoft account
def devAuthEnabled = System.getenv('CI') == null && localProperties.getProperty('devauth', 'true').toBoolean()

version = localProperties.getProperty('mod_version', project.mod_version)
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
        content { includeGroup "me.djtheredstoner" }
    }
    mavenCentral()
}

loom {
    runs {
        client {
            if (devAuthEnabled) {
                property "devauth.enabled", "true"
                property "devauth.account", localProperties.getProperty('devauth_account', 'main')
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "maven.modrinth:wynntils:v4.1.10-fabric"
    modCompileOnly "maven.modrinth:modmenu:17.0.1"
    implementation "org.java-websocket:Java-WebSocket:1.6.0"
    include "org.java-websocket:Java-WebSocket:1.6.0"
    if (devAuthEnabled) {
        modRuntimeOnly "me.djtheredstoner:DevAuth-fabric:1.2.2"
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "org.mockito:mockito-junit-jupiter:5.14.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat = "full"
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // Exclude code that only runs inside a live Minecraft client
    classDirectories.setFrom(files(classDirectories.files.collect { dir ->
        fileTree(dir: dir, exclude: [
            'info/avicia/avoutils/AvoUtilsMod*',
            'info/avicia/avoutils/core/gui/**',
            'info/avicia/avoutils/core/command/**',
            'info/avicia/avoutils/mixin/**',
            'info/avicia/avoutils/features/partyfinder/gui/**',
            'info/avicia/avoutils/features/partyfinder/command/**',
            'info/avicia/avoutils/features/anniparty/AnniPartyScreen*',
            'info/avicia/avoutils/features/emojis/EmojiTooltipComponent*'
        ])
    }))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Backend address to build into the jar. If not specified, defaults to the production backend.
def apiBaseUrl = (localProperties.getProperty('api_base_url')
        ?: project.findProperty('api_base_url')
        ?: 'https://auth.avicia.info:8443').toString().trim().replaceAll('/+$', '')
def apiBaseUri = new URI(apiBaseUrl)
def isLocalApi = apiBaseUri.host in ['localhost', '127.0.0.1', '[::1]']
if (apiBaseUri.host == null || !(apiBaseUri.scheme == 'https' || (apiBaseUri.scheme == 'http' && isLocalApi))) {
    throw new GradleException("api_base_url '${apiBaseUrl}' must be an https:// address "
            + "(plain http:// is only allowed for localhost).")
}

// Generate a BuildConfig.java file with the API base URL baked in at build time.
def buildConfigDir = layout.buildDirectory.dir('generated/sources/buildConfig/java/main')
def generateBuildConfig = tasks.register('generateBuildConfig') {
    inputs.property('apiBaseUrl', apiBaseUrl)
    outputs.dir(buildConfigDir)
    doLast {
        def source = buildConfigDir.get().file('info/avicia/avoutils/BuildConfig.java').asFile
        source.parentFile.mkdirs()
        source.text = """\
package info.avicia.avoutils;

/** Generated by the generateBuildConfig task in build.gradle. Do not edit. */
public final class BuildConfig {
    /** Backend address the mod talks to, fixed at build time. */
    public static final String API_BASE_URL = "${apiBaseUrl}";

    private BuildConfig() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(generateBuildConfig)

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
