name: CI Build

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Loom Caches
        uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: ${{ runner.os }}-loom-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-loom-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Version
        id: determine_version
        shell: bash
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-beta*' --exclude '*-dev*' 2>/dev/null || echo "v1.0.0")
          BASE_VERSION="${LATEST_TAG#v}"
          VERSION="${BASE_VERSION}-dev.${{ github.run_number }}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test -Pmod_version="${{ steps.determine_version.outputs.version }}" --console=plain

      - name: Build Mod with Gradle
        run: |
          ./gradlew build -x test -Pmod_version="${{ steps.determine_version.outputs.version }}"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avo-utils-mod
          path: |
            build/libs/avoutils-*.jar
            !build/libs/avoutils-*-sources.jar
            !build/libs/avoutils-*-dev.jar
