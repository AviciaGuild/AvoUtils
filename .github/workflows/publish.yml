name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - beta
          - release
        default: 'beta'
      bump_type:
        description: 'Version bump for main release (ignored for beta)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine_version.outputs.version }}
      tag_name: ${{ steps.determine_version.outputs.tag_name }}
      version_type: ${{ steps.determine_version.outputs.version_type }}
      should_publish: ${{ steps.determine_version.outputs.should_publish }}
      should_publish_modrinth: ${{ steps.determine_version.outputs.should_publish_modrinth }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      minecraft_version: ${{ steps.determine_version.outputs.minecraft_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Release Scripts
        shell: bash
        run: |
          chmod +x .github/scripts/*.sh
          ./.github/scripts/test-release-scripts.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Loom Caches
        uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: ${{ runner.os }}-loom-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-loom-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Version
        id: determine_version
        shell: bash
        run: |
          ./.github/scripts/determine-version.sh \
            "${{ github.event_name }}" \
            "${{ inputs.release_type || 'beta' }}" \
            "${{ inputs.bump_type || 'patch' }}" \
            "${{ github.ref }}" \
            "${{ github.ref_name }}"

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test -Pmod_version="${{ steps.determine_version.outputs.version }}" --console=plain

      - name: Build Mod with Gradle
        run: |
          ./gradlew build -x test -Pmod_version="${{ steps.determine_version.outputs.version }}"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avo-utils-mod
          path: |
            build/libs/avoutils-*.jar
            !build/libs/avoutils-*-sources.jar
            !build/libs/avoutils-*-dev.jar

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          ./.github/scripts/generate-changelog.sh \
            "${{ steps.determine_version.outputs.tag_name }}" \
            "${{ steps.determine_version.outputs.version_type }}" \
            "${{ github.repository }}" \
            "${{ steps.determine_version.outputs.prev_tag }}"

  github-release:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: avo-utils-mod
          path: dist

      - name: Locate Release Jar
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t release_jars < <(find dist -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#release_jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one release jar, found ${#release_jars[@]}" >&2
            printf 'Found jars:\n%s\n' "${release_jars[@]}" >&2
            exit 1
          fi

          echo "jar=${release_jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          body: ${{ needs.build.outputs.changelog }}
          files: ${{ steps.locate.outputs.jar }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}

  modrinth-publish:
    needs: build
    if: needs.build.outputs.should_publish_modrinth == 'true'
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_SLUG: ${{ secrets.MODRINTH_PROJECT_SLUG }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: avo-utils-mod
          path: dist

      - name: Resolve Modrinth Metadata
        id: modrinth_meta
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t release_jars < <(find dist -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#release_jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one release jar, found ${#release_jars[@]}" >&2
            printf 'Found jars:\n%s\n' "${release_jars[@]}" >&2
            exit 1
          fi

          echo "mod_jar=${release_jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        shell: bash
        run: |
          set -euo pipefail

          echo "Resolving Modrinth project ID for slug '${MODRINTH_PROJECT_SLUG}'..."
          if ! project_response="$(curl --fail-with-body --show-error --silent \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: AviciaGuild/AvoUtils-release-workflow" \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_SLUG}")"; then
            echo "Failed to resolve Modrinth project for slug '${MODRINTH_PROJECT_SLUG}'." >&2
            echo "Modrinth response body:" >&2
            printf '%s\n' "${project_response}" >&2
            exit 1
          fi

          project_id="$(jq -r '.id' <<<"${project_response}")"
          if [[ -z "${project_id}" || "${project_id}" == "null" ]]; then
            echo "Modrinth project response did not contain an id. Response:" >&2
            printf '%s\n' "${project_response}" >&2
            exit 1
          fi

          echo "Resolved project_id=${project_id}"

          payload="$(jq -cn \
            --arg name "AvoUtils ${{ needs.build.outputs.version }}" \
            --arg version_number "${{ needs.build.outputs.version }}" \
            --arg changelog "${{ needs.build.outputs.changelog }}" \
            --arg project_id "${project_id}" \
            --arg minecraft_version "${{ needs.build.outputs.minecraft_version }}" \
            '{
              name: $name,
              version_number: $version_number,
              changelog: $changelog,
              project_id: $project_id,
              game_versions: [$minecraft_version],
              version_type: "${{ needs.build.outputs.version_type }}",
              dependencies: [
                { project_id: "P7dR8mSH", dependency_type: "required" },
                { project_id: "dU5Gb9Ab", dependency_type: "optional" }
              ],
              loaders: ["fabric"],
              featured: true,
              status: "listed",
              file_parts: ["primary"],
              primary_file: "primary"
            }'
          )"

          echo "Creating Modrinth version ${{ needs.build.outputs.version }}..."
          if ! response="$(curl --fail-with-body --show-error --silent \
            -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: AviciaGuild/AvoUtils-release-workflow" \
            --form-string "data=${payload}" \
            -F "primary=@${{ steps.modrinth_meta.outputs.mod_jar }}")"; then
            echo "Failed to create Modrinth version." >&2
            echo "Modrinth response body:" >&2
            printf '%s\n' "${response}" >&2
            exit 1
          fi

          echo "Published to Modrinth successfully:"
          jq -r '"  version_id: \(.id)\n  version_number: \(.version_number)"' <<<"${response}"
